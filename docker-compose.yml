services:

  postgres:
    image: postgres:16-alpine
    container_name: genesis-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: genesis
      POSTGRES_USER: genesis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-genesis_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: genesis-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/genesis
      SPRING_DATASOURCE_USERNAME: genesis
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-genesis_dev}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build: ./frontend
    container_name: genesis-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Optional: local LLM via Ollama (run with: docker compose --profile local-ai up)
  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:latest
    container_name: genesis-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # Optional: image generation via LocalAI + Stable Diffusion
  # Requires a machine with an NVIDIA GPU. NOT supported on Mac Apple Silicon via Docker.
  # On Mac: logo generation uses the LLM to generate SVG (no extra service needed).
  # On Linux with NVIDIA GPU:
  #   1. Use image: localai/localai:latest-gpu-nvidia-cuda-12
  #   2. Add: deploy: { resources: { reservations: { devices: [{ capabilities: [gpu] }] } } }
  #   3. Set in .env: IMAGE_MODEL_PROVIDER=openai, IMAGE_BASE_URL=http://localai:8080/v1, IMAGE_MODEL=sd-1.5-ggml
  #   4. Run: docker compose --profile local-images up
  localai:
    profiles: ["local-images"]
    image: localai/localai:latest-gpu-nvidia-cuda-12
    container_name: genesis-localai
    ports:
      - "8081:8080"
    environment:
      THREADS: "4"
      MODELS_PATH: /models
      # Auto-install Stable Diffusion 1.5 GGUF on first run (~1.5GB download)
      PRELOAD_MODELS: '[{"id": "sd-1.5-ggml"}]'
    volumes:
      - localai_models:/models

volumes:
  postgres_data:
  ollama_data:
  localai_models:
